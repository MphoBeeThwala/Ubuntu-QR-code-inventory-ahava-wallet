---
# Secrets Template for Ubuntu Pay Kubernetes Deployments
#
# To create secrets, run:
# kubectl create secret generic secret-name --namespace=ubuntu-pay #   --from-literal=KEY=VALUE
#
# Or create a secrets.yaml file and apply with kubectl apply -f secrets.yaml
# (Make sure to add secrets.yaml to .gitignore!)

# Required secrets:
# - postgres-secrets (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB)
# - redis-secrets (REDIS_PASSWORD)
# - api-gateway-secrets (JWT_SECRET, JWT_REFRESH_SECRET, API_KEY)
# - auth-service-secrets (JWT_SECRET, JWT_REFRESH_SECRET, PIN_ENCRYPTION_KEY)
# - wallet-service-secrets (DATABASE_URL)
# - payment-service-secrets (DATABASE_URL, PAYSHAP_API_KEY)
# - notification-service-secrets (SMS_API_KEY, SENDGRID_API_KEY)
# - aml-service-secrets (DATABASE_URL)
# - external-services-secrets (AFRICAS_TALKING_API_KEY, etc.)
