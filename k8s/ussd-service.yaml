apiVersion: apps/v1
kind: Deployment
metadata:
  name: ussd-service
  namespace: ahava
  labels:
    app: ussd-service
    app.kubernetes.io/part-of: ahava-ewallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ussd-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ussd-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ussd-service
          image: ahava/ussd-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6008
              name: http
          envFrom:
            - configMapRef:
                name: ahava-config
            - secretRef:
                name: ahava-secrets
          env:
            - name: PORT
              value: "6008"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 6008
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 6008
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: ussd-service
  namespace: ahava
  labels:
    app: ussd-service
  annotations:
    # Africa's Talking USSD callbacks need to reach this service
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: ussd-service
  ports:
    - name: http
      port: 80
      targetPort: 6008
