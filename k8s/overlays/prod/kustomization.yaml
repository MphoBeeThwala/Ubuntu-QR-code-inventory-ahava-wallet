apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../
  - ../../ingress.yaml
  - external-secrets.yaml

namespace: ahava-prod

images:
  - name: ahava/api-gateway
    newTag: prod
  - name: ahava/auth-service
    newTag: prod
  - name: ahava/wallet-service
    newTag: prod
  - name: ahava/payment-service
    newTag: prod
  - name: ahava/kyc-service
    newTag: prod
  - name: ahava/notification-service
    newTag: prod
  - name: ahava/reporting-service
    newTag: prod
  - name: ahava/aml-service
    newTag: prod
  - name: ahava/ussd-service
    newTag: prod
  - name: ahava/agent-service
    newTag: prod

patchesStrategicMerge:
  - ingress-patch.yaml

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1024Mi
