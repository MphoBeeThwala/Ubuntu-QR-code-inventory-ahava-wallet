# ─────────────────────────────────────────────────────────────────────────────
# SECRETS TEMPLATE — Do NOT commit with real values.
# In production these are injected by AWS Secrets Manager via External Secrets
# Operator (ESO) or sealed-secrets. This file documents required keys only.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ahava-secrets
  namespace: ahava
  annotations:
    # If using External Secrets Operator, replace this with ExternalSecret CR
    secrets-store.csi.x-k8s.io/used: "true"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASS@HOST:5432/ahava_prod?sslmode=require"
  REDIS_URL: "redis://:PASSWORD@HOST:6379"
  JWT_PRIVATE_KEY: "<RS256 PEM private key — store in AWS Secrets Manager>"
  JWT_PUBLIC_KEY: "<RS256 PEM public key>"
  PII_ENCRYPTION_KEY: "<32-byte hex key for AES-256-GCM>"
  HASH_SALT: "<random 32-char string for SHA-256 lookup hashing>"
  AWS_ACCESS_KEY_ID: "<IAM key for S3/KMS — prefer IRSA in EKS>"
  AWS_SECRET_ACCESS_KEY: "<IAM secret — prefer IRSA in EKS>"
  SENTRY_DSN: "<Sentry project DSN>"
  AFRICAS_TALKING_API_KEY: "<Africa's Talking USSD/SMS key>"
  AFRICAS_TALKING_USERNAME: "<Africa's Talking username>"
  FCM_SERVER_KEY: "<Firebase Cloud Messaging server key>"
