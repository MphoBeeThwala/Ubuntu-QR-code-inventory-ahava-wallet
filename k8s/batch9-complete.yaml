---
# BATCH 9: Kubernetes Deployments
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ubuntu-pay
  labels:
    name: ubuntu-pay
    environment: production
    platform: ubuntu-pay
    tier: backend

---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ubuntu-pay
  labels:
    app: api-gateway
    service: api-gateway
    tier: backend
    component: gateway
    batch: "9"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        service: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/mphobeethwala/ubuntu-pay-api-gateway:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true

---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ubuntu-pay
  labels:
    app: api-gateway
    service: api-gateway
    tier: backend
    batch: "9"
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: LoadBalancer

---
# Auth Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ubuntu-pay
  labels:
    app: auth-service
    service: auth-service
    tier: backend
    component: authentication
    batch: "9"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        service: auth-service
    spec:
      containers:
      - name: auth-service
        image: ghcr.io/mphobeethwala/ubuntu-pay-auth-service:latest
        ports:
        - containerPort: 6001
        envFrom:
        - configMapRef:
            name: auth-service-config
        - secretRef:
            name: auth-service-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 6001
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 6001
          initialDelaySeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true

---
# Auth Service Service
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ubuntu-pay
  labels:
    app: auth-service
    service: auth-service
    tier: backend
    batch: "9"
spec:
  selector:
    app: auth-service
  ports:
  - port: 80
    targetPort: 6001
    protocol: TCP
  type: ClusterIP

---
# Wallet Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: ubuntu-pay
  labels:
    app: wallet-service
    service: wallet-service
    tier: backend
    component: wallet
    batch: "9"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
        service: wallet-service
    spec:
      containers:
      - name: wallet-service
        image: ghcr.io/mphobeethwala/ubuntu-pay-wallet-service:latest
        ports:
        - containerPort: 6002
        envFrom:
        - configMapRef:
            name: wallet-service-config
        - secretRef:
            name: wallet-service-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 6002
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 6002
          initialDelaySeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true

---
# Wallet Service Service
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: ubuntu-pay
  labels:
    app: wallet-service
    service: wallet-service
    tier: backend
    batch: "9"
spec:
  selector:
    app: wallet-service
  ports:
  - port: 80
    targetPort: 6002
    protocol: TCP
  type: ClusterIP

---
# Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ubuntu-pay-ingress
  namespace: ubuntu-pay
  labels:
    app: ubuntu-pay
    component: ingress
    batch: "9"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - api.ubuntupay.co.za
    - app.ubuntupay.co.za
    secretName: ubuntu-pay-tls
  rules:
  - host: api.ubuntupay.co.za
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
  - host: app.ubuntupay.co.za
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
