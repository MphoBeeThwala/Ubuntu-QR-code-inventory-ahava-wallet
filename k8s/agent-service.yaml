apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: ahava
  labels:
    app: agent-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
        tier: backend
    spec:
      containers:
        - name: agent-service
          image: ahava/agent-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6009
              name: http
          envFrom:
            - configMapRef:
                name: ahava-config
            - secretRef:
                name: ahava-secrets
          env:
            - name: PORT
              value: "6009"
          livenessProbe:
            httpGet:
              path: /health
              port: 6009
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 6009
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: ahava
  labels:
    app: agent-service
spec:
  selector:
    app: agent-service
  ports:
    - name: http
      port: 6009
      targetPort: 6009
  type: ClusterIP
