apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: ahava
  labels:
    app: reporting-service
    app.kubernetes.io/part-of: ahava-ewallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: reporting-service
          image: ahava/reporting-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6006
              name: http
          envFrom:
            - configMapRef:
                name: ahava-config
            - secretRef:
                name: ahava-secrets
          env:
            - name: PORT
              value: "6006"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 6006
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 6006
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: ahava
  labels:
    app: reporting-service
spec:
  type: ClusterIP
  selector:
    app: reporting-service
  ports:
    - name: http
      port: 6006
      targetPort: 6006
