---
# k8s/external-secrets.yaml
# External Secrets Operator (ESO) resources that sync AWS Secrets Manager
# values into the ahava-secrets Kubernetes Secret.
#
# Prerequisites:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets-operator --create-namespace
#
# The ESO controller assumes the IAM role annotated on its ServiceAccount (IRSA).

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ahava-aws-secrets
  namespace: ahava
  labels:
    app.kubernetes.io/part-of: ahava-ewallet
spec:
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: ahava
  annotations:
    # Populated by Terraform output: aws_iam_role.service_irsa["api-gateway"].arn
    eks.amazonaws.com/role-arn: ""
  labels:
    app.kubernetes.io/part-of: ahava-ewallet
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ahava-secrets
  namespace: ahava
  labels:
    app.kubernetes.io/part-of: ahava-ewallet
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: ahava-aws-secrets
    kind: SecretStore

  target:
    name: ahava-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2

  data:
    # ── Database ───────────────────────────────────────────────────
    - secretKey: DATABASE_URL
      remoteRef:
        key: /ahava/{{ .Env }}/rds-master-password
        property: connection_url

    # ── Redis ──────────────────────────────────────────────────────
    - secretKey: REDIS_URL
      remoteRef:
        key: /ahava/{{ .Env }}/redis-auth-token
        property: connection_url

    # ── JWT ───────────────────────────────────────────────────────
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: /ahava/{{ .Env }}/jwt-private-key

    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: /ahava/{{ .Env }}/jwt-public-key

    # ── PII ───────────────────────────────────────────────────────
    - secretKey: PII_ENCRYPTION_KEY
      remoteRef:
        key: /ahava/{{ .Env }}/pii-encryption-key

    - secretKey: HASH_SALT
      remoteRef:
        key: /ahava/{{ .Env }}/hash-salt

    # ── PayShap ───────────────────────────────────────────────────
    - secretKey: PAYSHAP_MTLS_CERT
      remoteRef:
        key: /ahava/{{ .Env }}/payshap-mtls-cert

    - secretKey: PAYSHAP_MTLS_KEY
      remoteRef:
        key: /ahava/{{ .Env }}/payshap-mtls-key

    # ── AML ───────────────────────────────────────────────────────
    - secretKey: COMPLY_ADVANTAGE_API_KEY
      remoteRef:
        key: /ahava/{{ .Env }}/comply-advantage-api-key

    # ── Notifications ─────────────────────────────────────────────
    - secretKey: AFRICAS_TALKING_CREDENTIALS
      remoteRef:
        key: /ahava/{{ .Env }}/africas-talking

    - secretKey: FCM_SERVER_KEY
      remoteRef:
        key: /ahava/{{ .Env }}/fcm-server-key

    # ── Monitoring ────────────────────────────────────────────────
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /ahava/{{ .Env }}/sentry-dsn

    - secretKey: DATADOG_API_KEY
      remoteRef:
        key: /ahava/{{ .Env }}/datadog-api-key
