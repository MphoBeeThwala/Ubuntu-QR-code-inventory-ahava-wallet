apiVersion: v1
kind: ConfigMap
metadata:
  name: ahava-config
  namespace: ahava
  labels:
    app.kubernetes.io/part-of: ahava-ewallet
data:
  NODE_ENV: "production"
  AWS_REGION: "af-south-1"
  REDIS_HOST: "ahava-redis.internal"
  REDIS_PORT: "6379"
  # Service-to-service discovery (internal cluster DNS)
  AUTH_SERVICE_URL: "http://auth-service:6001"
  WALLET_SERVICE_URL: "http://wallet-service:6002"
  PAYMENT_SERVICE_URL: "http://payment-service:6003"
  KYC_SERVICE_URL: "http://kyc-service:6004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:6005"
  REPORTING_SERVICE_URL: "http://reporting-service:6006"
  AML_SERVICE_URL: "http://aml-service:6007"
  USSD_SERVICE_URL: "http://ussd-service:6008"
