apiVersion: v1
kind: ConfigMap
metadata:
  name: ahava-config
  namespace: ahava
  labels:
    app.kubernetes.io/part-of: ahava-ewallet
data:
  NODE_ENV: "production"
  AWS_REGION: "af-south-1"
  REDIS_HOST: "ahava-redis.internal"
  REDIS_PORT: "6379"
  # Service-to-service discovery (internal cluster DNS)
  AUTH_SERVICE_URL: "http://auth-service:6001"
  WALLET_SERVICE_URL: "http://wallet-service:6002"
  PAYMENT_SERVICE_URL: "http://payment-service:6003"
  KYC_SERVICE_URL: "http://kyc-service:6004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:6005"
  REPORTING_SERVICE_URL: "http://reporting-service:6006"
  AML_SERVICE_URL: "http://aml-service:6007"
  USSD_SERVICE_URL: "http://ussd-service:6008"
  INVENTORY_SERVICE_URL: "http://inventory-service:6010"
  # Must be PAYSHAP_SERVICE_URL, not PAYSHAP_MOCK_URL — api-gateway reads
  # process.env.PAYSHAP_SERVICE_URL (matching every other service's
  # <NAME>_SERVICE_URL convention above). The old key name meant the
  # gateway never actually saw this value in a real deployment and fell
  # back to its hardcoded "http://localhost:6011" default, which doesn't
  # resolve inside the api-gateway pod — every /payshap/* request routed
  # through the gateway would have failed.
  PAYSHAP_SERVICE_URL: "http://payshap-mock:6011"
  LEDGER_SERVICE_URL: "http://ledger-service:6004"
  PAYMENT_ORCHESTRATOR_URL: "http://payment-orchestrator:6005"
  # Compliance team distribution address — aml-service's MlroNotifier sends
  # AML flag alerts here. Replace with the real Money Laundering Reporting
  # Officer / compliance team's address before deploying; alerts silently
  # fail to dispatch (logged and marked FAILED, retried, then dropped)
  # without a real address configured.
  MLRO_ALERT_EMAIL: "compliance@ahava.example"
  # kyc-service issues presigned S3 PUT URLs against this bucket for
  # identity-document uploads (POST /kyc/document/upload-url). Replace with
  # the real bucket name before deploying.
  KYC_DOCUMENTS_BUCKET: "ahava-kyc-documents-prod"
