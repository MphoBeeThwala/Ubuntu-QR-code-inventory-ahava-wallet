    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  wallet-service-integration:
    <<: *workspace-base
    profiles: ["integration"]
    depends_on:
      seed-integration:
        condition: service_healthy
    environment:
      NODE_ENV: integration
      PORT: 3002
      DATABASE_URL: postgresql://ahava:ahava_integration_pw@postgres-integration:5432/ahava_integration
    command: sh -lc "npm run dev --workspace @ahava/wallet-service"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  payment-service-integration:
    <<: *workspace-base
    profiles: ["integration"]
    depends_on:
      seed-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
    environment:
      NODE_ENV: integration
      PORT: 3003
      DATABASE_URL: postgresql://ahava:ahava_integration_pw@postgres-integration:5432/ahava_integration
      REDIS_URL: redis://redis-integration:6379
    command: sh -lc "npm run dev --workspace @ahava/payment-service"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  kyc-service-integration:
    <<: *workspace-base
    profiles: ["integration"]
    depends_on:
      seed-integration:
        condition: service_healthy
    environment:
      NODE_ENV: integration
      PORT: 3004
      DATABASE_URL: postgresql://ahava:ahava_integration_pw@postgres-integration:5432/ahava_integration
    command: sh -lc "npm run dev --workspace @ahava/kyc-service"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway-integration:
    <<: *workspace-base
    profiles: ["integration"]
    depends_on:
      auth-service-integration:
        condition: service_healthy
      wallet-service-integration:
        condition: service_healthy
      payment-service-integration:
        condition: service_healthy
      kyc-service-integration:
        condition: service_healthy
    environment:
      NODE_ENV: integration
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service-integration:3001
      WALLET_SERVICE_URL: http://wallet-service-integration:3002
      PAYMENT_SERVICE_URL: http://payment-service-integration:3003
      KYC_SERVICE_URL: http://kyc-service-integration:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:6005
    command: sh -lc "npm run dev --workspace @ahava/api-gateway"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  integration_root_node_modules:
  integration_api_gateway_node_modules:
  integration_auth_node_modules:
  integration_wallet_node_modules:
  integration_payment_node_modules:
  integration_kyc_node_modules:
  integration_notification_node_modules:
  integration_aml_node_modules:
  integration_reporting_node_modules:
  integration_shared_crypto_node_modules:
  integration_shared_errors_node_modules:
  integration_shared_events_node_modules:
  integration_shared_types_node_modules:
  integration_database_node_modules:
  postgres_integration_data:
  redis_integration_data:
