x-workspace-base: &workspace-base
  image: node:20
  working_dir: /workspace
  volumes:
    - ./:/workspace
    - integration_root_node_modules:/workspace/node_modules
    - integration_api_gateway_node_modules:/workspace/services/api-gateway/node_modules
    - integration_auth_node_modules:/workspace/services/auth-service/node_modules
    - integration_wallet_node_modules:/workspace/services/wallet-service/node_modules
    - integration_payment_node_modules:/workspace/services/payment-service/node_modules
    - integration_kyc_node_modules:/workspace/services/kyc-service/node_modules
    - integration_notification_node_modules:/workspace/services/notification-service/node_modules
    - integration_aml_node_modules:/workspace/services/aml-service/node_modules
    - integration_reporting_node_modules:/workspace/services/reporting-service/node_modules
    - integration_shared_crypto_node_modules:/workspace/packages/shared-crypto/node_modules
    - integration_shared_errors_node_modules:/workspace/packages/shared-errors/node_modules
    - integration_shared_events_node_modules:/workspace/packages/shared-events/node_modules
    - integration_shared_types_node_modules:/workspace/packages/shared-types/node_modules
    - integration_database_node_modules:/workspace/packages/database/node_modules

services:
  postgres-integration:
    profiles: ["integration"]
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ahava
      POSTGRES_PASSWORD: ahava_integration_pw
      POSTGRES_DB: ahava_integration
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "55432:5432"
    volumes:
      - postgres_integration_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahava -d ahava_integration"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-integration:
    profiles: ["integration"]
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - redis_integration_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  deps-integration:
    <<: *workspace-base
    profiles: ["integration"]
    command: >
      sh -lc "npm ci && touch /tmp/deps-ready && tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/deps-ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate-integration:
    <<: *workspace-base
    profiles: ["integration"]
    depends_on:
      deps-integration:
        condition: service_healthy
      postgres-integration:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ahava:ahava_integration_pw@postgres-integration:5432/ahava_integration
    command: >
      sh -lc "npx prisma@5.22.0 generate --schema=prisma/schema.prisma &&
      npx prisma@5.22.0 migrate deploy --schema=prisma/schema.prisma &&
      npx prisma@5.22.0 db execute --schema=prisma/schema.prisma --file=scripts/integration-auditlog-compat.sql &&
      touch /tmp/migrate-ready && tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/migrate-ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed-integration:
    <<: *workspace-base
    profiles: ["integration"]
    depends_on:
      migrate-integration:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ahava:ahava_integration_pw@postgres-integration:5432/ahava_integration
    command: >
      sh -lc "node scripts/seed-integration.js &&
      touch /tmp/seed-ready && tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seed-ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  auth-service-integration:
    <<: *workspace-base
    profiles: ["integration"]
    depends_on:
      seed-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
