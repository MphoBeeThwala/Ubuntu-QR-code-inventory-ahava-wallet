apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ahava-jwt-keys
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: ahava-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-private-key
      remoteRef:
        key: /ahava/production/jwt-private-key # Changed 'prod' to 'production'
