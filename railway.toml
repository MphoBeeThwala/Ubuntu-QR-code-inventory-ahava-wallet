# Ahava eWallet — Root Railway Configuration
# This file defines all services for the Railway monorepo.
# Each service points to its respective directory and uses local npm commands.

[services.api-gateway]
name = "api-gateway"
sourceDirectory = "."
dockerfilePath = "Dockerfile.service"
buildCommand = "docker build -f Dockerfile.service --build-arg SERVICE_NAME=api-gateway -t api-gateway ."
startCommand = "node dist/main.js"

