# Ahava eWallet — Root Railway Configuration
# This file defines all services for the Railway monorepo.
# Each service points to its respective directory and uses local npm commands.

[services.api-gateway]
name = "api-gateway"
sourceDirectory = "."
buildCommand = "docker build -f services/api-gateway/Dockerfile -t api-gateway ."
startCommand = "node services/api-gateway/dist/main.js"

[services.auth-service]
name = "auth-service"
sourceDirectory = "."
buildCommand = "docker build -f services/auth-service/Dockerfile -t auth-service ."
startCommand = "node services/auth-service/dist/main.js"

[services.wallet-service]
name = "wallet-service"
sourceDirectory = "."
buildCommand = "docker build -f services/wallet-service/Dockerfile -t wallet-service ."
startCommand = "node services/wallet-service/dist/main.js"

