# Ahava eWallet — Root Railway Configuration
# This file defines all services for the Railway monorepo.
# Each service points to its respective directory and uses local npm commands.

[services.api-gateway]
name = "api-gateway"
sourceDirectory = "services/api-gateway"
buildCommand = "npm run build"
startCommand = "npm run start"

[services.auth-service]
name = "auth-service"
sourceDirectory = "services/auth-service"
buildCommand = "npx prisma generate --schema=../../prisma/schema.prisma && npm run build"
startCommand = "npm run start"

[services.wallet-service]
name = "wallet-service"
sourceDirectory = "services/wallet-service"
buildCommand = "npx prisma generate --schema=../../prisma/schema.prisma && npm run build"
