# .github/workflows/deploy.yml
# Manual Terraform infrastructure deployment workflow.
# Application CI/CD (build, test, Docker push, k8s rollout) lives in ci-cd.yml.
# This workflow is for provisioning or updating AWS infrastructure via Terraform.

name: Terraform Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

env:
  AWS_REGION: af-south-1
  TF_DIR: infrastructure/terraform

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform ${{ inputs.action }} (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="${{ inputs.environment }}.tfvars" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Post plan summary
        run: terraform show -no-color tfplan | head -200

      - name: Terraform Apply
        if: inputs.action == 'apply' && steps.plan.outputs.exitcode != '1'
        run: |
          terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy' && inputs.environment != 'prod'
        run: |
          terraform destroy \
            -var-file="${{ inputs.environment }}.tfvars" \
            -auto-approve

      - name: Guard — destroy blocked on prod
        if: inputs.action == 'destroy' && inputs.environment == 'prod'
        run: |
          echo "::error::Destroy is blocked on the prod environment. Use AWS Console with MFA."
          exit 1
