    branch: main
    dockerfilePath: Dockerfile.service
    dockerContext: .
    envVars:
      - key: SERVICE_NAME
        value: kyc-service
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: ahava-postgres
          type: pserv
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ahava-redis
          type: redis
          property: connectionString
    healthCheckPath: /health
