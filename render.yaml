    repo: https://github.com/MphoBeeThwala/Ubuntu-QR-code-inventory-ahava-wallet
    branch: main
    dockerfilePath: Dockerfile.service
    dockerContext: .
    envVars:
      - key: SERVICE_NAME
        value: payment-orchestrator
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: ahava-postgres
          type: pserv
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ahava-redis
          type: redis
          property: connectionString
      - key: WALLET_SERVICE_URL
        fromService:
          name: ahava-wallet-service
          type: web
          property: host
      - key: PAYMENT_SERVICE_URL
        fromService:
          name: ahava-payment-service
          type: web
          property: host
      - key: LEDGER_SERVICE_URL
        fromService:
          name: ahava-ledger-service
          type: web
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: ahava-notification-service
          type: web
          property: host
      - key: AML_SERVICE_URL
        fromService:
          name: ahava-aml-service
          type: web
          property: host
    healthCheckPath: /health
    plan: standard

  - type: web
    name: ahava-pwa
    runtime: node
    repo: https://github.com/MphoBeeThwala/Ubuntu-QR-code-inventory-ahava-wallet
    branch: main
    buildCommand: cd apps/pwa && npm install && npm run build
    startCommand: cd apps/pwa && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: ahava-api-gateway
          type: web
          property: url
    plan: starter

  - type: web
    name: ahava-agent-portal
    runtime: node
    repo: https://github.com/MphoBeeThwala/Ubuntu-QR-code-inventory-ahava-wallet
    branch: main
    buildCommand: cd apps/agent-portal && npm install && npm run build
    startCommand: cd apps/agent-portal && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: ahava-api-gateway
          type: web
          property: url
    plan: starter