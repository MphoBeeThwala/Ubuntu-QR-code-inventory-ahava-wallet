          type: pserv
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ahava-redis
          type: redis
          property: connectionString
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SES_FROM_ADDRESS
        value: noreply@ahava.co.za
    healthCheckPath: /health
    plan: starter

  - type: web
    name: ahava-aml-service
    runtime: docker
    repo: https://github.com/MphoBeeThwala/Ubuntu-QR-code-inventory-ahava-wallet
    branch: main
    dockerfilePath: Dockerfile.service
    dockerContext: .
    envVars:
      - key: SERVICE_NAME
        value: aml-service
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
